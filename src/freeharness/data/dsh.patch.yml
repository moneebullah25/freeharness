# Shared overlay: free web-chat backend via chatgpt-bridge/shim.py + a trimmed toolset.
# Used with:  dsh --profile sdk --patch free.patch.yml   (terminal client)
- id: llm-pi-ai
  config:
    providers:
      # CONTEXT WINDOW (tokens) dsh believes every model has: ONE value, the YAML anchor `&context_window`
      # on the first model below; the others alias it (`*context_window`). Replace an alias by a number to
      # give one model its own value. It is deliberately huge: dsh-compaction-basic condenses older history
      # into a model-written SUMMARY once a request nears ~80% of this window (and the pruner then shortens
      # old tool results), so a small value makes the model forget files it already read. Measured with
      # the real dsh (tests/test_dsh_context_window.py): at 80,000 the target file's text vanished from the
      # later requests; at 1,000,000 every request keeps every tool result verbatim. The real limits are
      # enforced by the site's own signals in the shim (full_markers, length errors, learned limits), and
      # a context_length_exceeded reply from the shim still makes dsh condense and retry once.
      bridge:
        displayName: Free web bridge
        apiKeyEnv: BRIDGE_KEY
        api: openai-completions
        baseURL: http://127.0.0.1:8766/v1
        # dsh drops a request that sends no bytes for 300s (its default). The shim holds a sticky chat's reply until it is
        # complete, so a slow site (ChatGPT thinking 5 minutes) looked dead: dsh cut the request, the shim forgot the chat
        # and the retry opened a NEW one (MEASURED 2026-10-28, 301s after the request). 1500s is above the shim's own
        # worst case per request (ChatGPT: 600s to start + 420s to finish, plus a cooldown it waits out in place); the
        # shim still bounds every wait.
        streamIdleTimeoutMs: 1500000
        retryPolicy:
          mode: normal
          maxRetries: 2
        models:
          - id: auto
            name: Auto (rotating free sites)
            contextWindow: &context_window 1000000
            reasoningEfforts: false
          - id: gemini
            name: Gemini (web, pinned)
            contextWindow: *context_window
            reasoningEfforts: false
          - id: perplexity
            name: Perplexity (web, pinned)
            contextWindow: *context_window
            reasoningEfforts: false
          - id: qwen
            name: Qwen (web, pinned)
            contextWindow: *context_window
            reasoningEfforts: false
          - id: grok
            name: Grok (web, pinned)
            contextWindow: *context_window
            reasoningEfforts: false
          - id: chatgpt
            name: ChatGPT (web, pinned)
            contextWindow: *context_window
            reasoningEfforts: false
          - id: deepseek
            name: DeepSeek (web, pinned)
            contextWindow: *context_window
            reasoningEfforts: false

# --- trimmed tools: every schema is re-sent (as prompt text) on every step of a
# free-tier chat, so keep only what a coding agent needs: bash, fs, search, todo.
- id: tool-working-directory
  disabled: true
- id: tool-subagent-control
  disabled: true
- id: tool-subagent-list-agents
  disabled: true
- id: tool-subagent
  disabled: true
- id: tool-subagent-fork
  disabled: true
- id: tool-workflow
  disabled: true
- id: tool-goal
  disabled: true
- id: tool-jobs
  disabled: true
- id: tool-web
  disabled: true
- id: plan-mode
  disabled: true

# --- tool configuration (verified by tests/test_tools.py)
# Background jobs need job_output/job_kill, which live in tool-jobs (disabled above): with
# promote-on-timeout the model would be told to use tools it does not have and the process
# would linger. Disable both so a timeout kills the command and returns an error result.
- id: tool-bash
  config:
    enableRunInBackground: false
    promoteOnTimeout: false
# read_image is useless on a text-only web chat; dropping it saves a schema per step.
- id: tool-fs
  config:
    readImage: false

# --- stage 1 security baseline (docs/ARCHITECTURE.md "Security"). dsh's defaults are already
# workspace-write for bash and write/edit, but dsh restricts neither reads nor the network.
# freeharness adds both through two files it ships (security.py passes the runner's
# location in FH_SANDBOX_RUNNER when it starts dsh):
#  * sandbox-local `runnerCommand` -> data/fh_sandbox_runner.py: dsh's own bwrap profile plus
#    no network and $HOME, /tmp, /run hidden. No bwrap = the bash call fails (SANDBOX_UNAVAILABLE
#    or a runner failure), it never runs unconfined. If the variable is missing the command
#    points at a path that does not exist, so that also fails closed.
#  * the fh-guard plugin (data/fh_guard.mjs): approval relay to the terminal client, and a
#    fence on read/grep/glob paths outside the workspace. A plugin row cannot name an absolute
#    path in static YAML, so security.guard_patch() writes that one row at start-up.
- id: sandbox
  config:
    runnerCommand: !!js "process.env.FH_SANDBOX_RUNNER ? JSON.parse(process.env.FH_SANDBOX_RUNNER) : ['/nonexistent/freeharness-sandbox-runner-not-configured']"
    runnerFailureSignatures: ['freeharness-sandbox: ', 'bwrap: ']
