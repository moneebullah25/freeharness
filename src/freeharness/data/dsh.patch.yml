# Shared overlay: free web-chat backend via chatgpt-bridge/shim.py + a trimmed toolset.
# Used with:  dsh --profile sdk --patch free.patch.yml   (terminal client)
- id: llm-pi-ai
  config:
    providers:
      bridge:
        displayName: Free web bridge
        apiKeyEnv: BRIDGE_KEY
        api: openai-completions
        baseURL: http://127.0.0.1:8766/v1
        retryPolicy:
          mode: normal
          maxRetries: 2
        models:
          - id: auto
            name: Auto (rotating free sites)
            contextWindow: 16000
            reasoningEfforts: false
          - id: gemini
            name: Gemini (web, pinned)
            contextWindow: 16000
            reasoningEfforts: false
          - id: perplexity
            name: Perplexity (web, pinned)
            contextWindow: 16000
            reasoningEfforts: false
          - id: qwen
            name: Qwen (web, pinned)
            contextWindow: 16000
            reasoningEfforts: false
          - id: grok
            name: Grok (web, pinned)
            contextWindow: 16000
            reasoningEfforts: false
          - id: chatgpt
            name: ChatGPT (web, pinned)
            contextWindow: 16000
            reasoningEfforts: false
          - id: deepseek
            name: DeepSeek (web, pinned)
            contextWindow: 16000
            reasoningEfforts: false

# --- trimmed tools: every schema is re-sent (as prompt text) on every step of a
# free-tier chat, so keep only what a coding agent needs: bash, fs, search, todo.
- id: tool-working-directory
  disabled: true
- id: tool-subagent-control
  disabled: true
- id: tool-subagent-list-agents
  disabled: true
- id: tool-subagent
  disabled: true
- id: tool-subagent-fork
  disabled: true
- id: tool-workflow
  disabled: true
- id: tool-goal
  disabled: true
- id: tool-jobs
  disabled: true
- id: tool-web
  disabled: true
- id: plan-mode
  disabled: true

# --- stage 1 security baseline (docs/ARCHITECTURE.md "Security"). dsh's defaults are already
# workspace-write for bash and write/edit, but dsh restricts neither reads nor the network.
# freeharness adds both through two files it ships (security.py passes the runner's
# location in FH_SANDBOX_RUNNER when it starts dsh):
#  * sandbox-local `runnerCommand` -> data/fh_sandbox_runner.py: dsh's own bwrap profile plus
#    no network and $HOME, /tmp, /run hidden. No bwrap = the bash call fails (SANDBOX_UNAVAILABLE
#    or a runner failure), it never runs unconfined. If the variable is missing the command
#    points at a path that does not exist, so that also fails closed.
#  * the fh-guard plugin (data/fh_guard.mjs): approval relay to the terminal client, and a
#    fence on read/grep/glob paths outside the workspace. A plugin row cannot name an absolute
#    path in static YAML, so security.guard_patch() writes that one row at start-up.
- id: sandbox
  config:
    runnerCommand: !!js "process.env.FH_SANDBOX_RUNNER ? JSON.parse(process.env.FH_SANDBOX_RUNNER) : ['/nonexistent/freeharness-sandbox-runner-not-configured']"
    runnerFailureSignatures: ['freeharness-sandbox: ', 'bwrap: ']
