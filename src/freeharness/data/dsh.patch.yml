# Shared overlay: free web-chat backend via chatgpt-bridge/shim.py + a trimmed toolset.
# Used with:  dsh --profile sdk --patch free.patch.yml   (terminal client)
- id: llm-pi-ai
  config:
    providers:
      bridge:
        displayName: Free web bridge
        apiKeyEnv: BRIDGE_KEY
        api: openai-completions
        baseURL: http://127.0.0.1:8766/v1
        retryPolicy:
          mode: normal
          maxRetries: 2
        models:
          - id: auto
            name: Auto (rotating free sites)
            contextWindow: 16000
            reasoningEfforts: false
          - id: gemini
            name: Gemini (web, pinned)
            contextWindow: 16000
            reasoningEfforts: false
          - id: perplexity
            name: Perplexity (web, pinned)
            contextWindow: 16000
            reasoningEfforts: false
          - id: qwen
            name: Qwen (web, pinned)
            contextWindow: 16000
            reasoningEfforts: false
          - id: grok
            name: Grok (web, pinned)
            contextWindow: 16000
            reasoningEfforts: false
          - id: chatgpt
            name: ChatGPT (web, pinned)
            contextWindow: 16000
            reasoningEfforts: false
          - id: deepseek
            name: DeepSeek (web, pinned)
            contextWindow: 16000
            reasoningEfforts: false

# --- trimmed tools: every schema is re-sent (as prompt text) on every step of a
# free-tier chat, so keep only what a coding agent needs: bash, fs, search, todo.
- id: tool-working-directory
  disabled: true
- id: tool-subagent-control
  disabled: true
- id: tool-subagent-list-agents
  disabled: true
- id: tool-subagent
  disabled: true
- id: tool-subagent-fork
  disabled: true
- id: tool-workflow
  disabled: true
- id: tool-goal
  disabled: true
- id: tool-jobs
  disabled: true
- id: tool-web
  disabled: true
- id: plan-mode
  disabled: true

# --- trust model: no human is ever on the other end of the SDK channel, so nothing
# may wait for one. Approval is `never` (a request that needs approval is refused at
# once and the model is told not to ask), while the sandbox stays workspace-write:
# bash runs in the OS sandbox and write/edit are fenced to the workspace + temp dirs.
# The `permission` row re-pins sessions to the preset's own approval, so both rows move.
- id: approval
  config:
    policy: never
- id: permission
  config:
    presets:
      workspace-write:
        sandbox: workspace-write
        approval: never
