name: ci
on:
  push: { branches: [main] }
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - uses: actions/setup-node@v4
        with: { node-version: "24" }
      - run: python -m pip install -e ".[dev]"
      - run: ruff check src tests
      - name: Install the pinned harness
        run: freeharness setup
      - run: pytest -q

  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "24" }
      - run: python -m pip install -e ".[dev]"
      # Fails on any known vulnerability in the Python runtime dependencies.
      - run: pip-audit --skip-editable
      # The harness has accepted moderate/high advisories (see SECURITY.md); critical fails the build.
      - run: npm ci --omit=dev --ignore-scripts --no-fund
        working-directory: src/freeharness/data/harness
      - run: npm audit --omit=dev --audit-level=critical
        working-directory: src/freeharness/data/harness

  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install build
      - run: python -m build --sdist --wheel
      - name: Smoke-test the built wheel in a clean venv
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          /tmp/clean/bin/freeharness version
          /tmp/clean/bin/freeharness doctor --report
