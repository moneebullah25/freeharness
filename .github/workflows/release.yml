name: release
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install build
      - name: Tag must match the package version
        run: |
          v="$(python -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          test "v$v" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != version v$v"; exit 1; }
      - run: ./scripts/release.sh
      - uses: actions/attest-build-provenance@v2
        with: { subject-path: "dist/*" }
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
